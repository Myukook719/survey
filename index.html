<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケートへ移動します</title>
</head>
<body>
  <p id="message">アンケートへ移動しています。しばらくお待ちください。</p>
  <p><a id="fallback" hidden>自動で移動しない場合はこちら</a></p>

  <script>
    const urls = [
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UMllZVE5MQ0ZUTEI1OURQTzUyTU1KOVhZRS4u",
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UNFBSS0xVWUhOM0VMTlZUREZYOFM4Vk9JNC4u",
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UQ0c3U0VQVloyWUYwMFQ3SjdBTlY2WEVTUi4u",
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UNDJTNVNOUk40RTBVVjdYTEVXWjYzSUkyVS4u",
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UQVlKQVpHWElQS1hUR0E0N1pEOVZCVURSVC4u",
      "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPlH9hjrv0mF4y3GV_95dSdF3k2h4MhKiBPaBdFRFB1UQThZOE9ZV0E2MDFHVjA4UzUwODNNMjRYRi4u"
    ];

    const storageKey = "student_survey_b_assignment_v1";

    let savedValue = null;

    try {
      savedValue = localStorage.getItem(storageKey);
    } catch (error) {
      // 保存機能が使えない場合も転送します。
    }

    let formNumber = Number(savedValue);

    if (
      savedValue === null ||
      savedValue.trim() === "" ||
      !Number.isInteger(formNumber) ||
      formNumber < 0 ||
      formNumber >= urls.length
    ) {
      formNumber = Math.floor(Math.random() * urls.length);

      try {
        localStorage.setItem(storageKey, String(formNumber));
      } catch (error) {
        // 保存できない場合、次回は再抽選になります。
      }
    }

    const destination = urls[formNumber];
    const fallback = document.getElementById("fallback");

    fallback.href = destination;
    fallback.hidden = false;

    window.location.replace(destination);
  </script>

  <noscript>
    <p>ブラウザのJavaScriptを有効にしてから、もう一度開いてください。</p>
  </noscript>
</body>
</html>
