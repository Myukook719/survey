<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンケートへ移動します</title>
</head>
<body>
  <p id="message">アンケートへ移動しています。しばらくお待ちください。</p>
  <p><a id="fallback" hidden>自動で移動しない場合はこちら</a></p>

  <script>
    const urls = [
      "https://docs.google.com/forms/d/e/1FAIpQLSdP_sPYqfN9ySF22ts_sXRWSNoO1tx9U7Uf9eaNKTc1psUCgQ/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLSfpCcragP1kkPP2CZnwowafHIb6NKmGfea_FRe-Wm1C2R5VWw/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLSeBSG1e9iNZCV2FvKs5KxgBBsxhWMoT0d6aLODRHk6mJ6lfkA/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLSd2atfcKAYXmia2QdVwpF7Su__HucMsod8Wl6GDgJsKOQ_V2g/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLScxbMFBnleDXK-pwoVniu0Kz8DTVLthfq9gZ8Mn3CMhIoJdEQ/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLSeAZxSzeUXLAezS0ucB1B-6uomvYaXd2UhMK4q2oWQD9JOgbQ/viewform?usp=dialog"
    ];

    const storageKey = "student_survey_b_assignment_v1";

    let savedValue = null;

    try {
      savedValue = localStorage.getItem(storageKey);
    } catch (error) {
      // 保存機能が使えない場合も転送します。
    }

    let formNumber = Number(savedValue);

    if (
      savedValue === null ||
      savedValue.trim() === "" ||
      !Number.isInteger(formNumber) ||
      formNumber < 0 ||
      formNumber >= urls.length
    ) {
      formNumber = Math.floor(Math.random() * urls.length);

      try {
        localStorage.setItem(storageKey, String(formNumber));
      } catch (error) {
        // 保存できない場合、次回は再抽選になります。
      }
    }

    const destination = urls[formNumber];
    const fallback = document.getElementById("fallback");

    fallback.href = destination;
    fallback.hidden = false;

    window.location.replace(destination);
  </script>

  <noscript>
    <p>ブラウザのJavaScriptを有効にしてから、もう一度開いてください。</p>
  </noscript>
</body>
</html>
